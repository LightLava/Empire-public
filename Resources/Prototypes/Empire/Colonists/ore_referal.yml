- type: entity
  name: telecrystal
  parent: BaseItem
  id: LogisticsTickets
  suffix: 1 LP, Empire, Colonists
  description: It seems to be pulsing with suspiciously enticing energies.
  components:
  - type: Sprite
    sprite: Empire/Colonists/ticket.rsi
    state: icon
  - type: Item
    sprite: Empire/Colonists/ticket.rsi
    size: Small
    storedRotation: -90
  - type: Stack
    count: 1
    stackType: Telecrystal
  - type: StaticPrice
    price: 0
  - type: StackPrice
    price: 1
  - type: Currency
    price:
      LogisticsPoints: 1

- type: currency
  id: LogisticsPoints
  displayName: store-currency-display-logistics-points
  cash:
    1: LogisticsTickets
  canWithdraw: true